<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>小和的奇妙数学之旅</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6fb0">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --sky:#2f6fb0;
    --sky-deep:#1c4a7a;
    --wheat:#e7b957;
    --cream:#fbf3e1;
    --ink:#2b2418;
    --paper:#f6ecd2;
    --paper-line:#d9c79a;
    --terracotta:#c9682f;   /* 史 */
    --guide-orange:#d98c2b; /* 导 */
    --practice-green:#4f9d5f; /* 练 */
    --done-blue:#5fa8dd;    /* 已完成统一色 */
    font-family: "PingFang SC","Heiti SC","Microsoft YaHei","HanaMinA",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#11151c; color:var(--ink);}

  /* 桌面宽屏下居中显示成一个"手机宽度"的窗口，避免封面图被横向裁剪变形；
     手机本身视口就窄，这层完全不影响真实手机上的显示效果 */
  #deviceFrame{
    position:fixed; inset:0; display:flex; justify-content:center; background:#11151c; overflow:hidden;
  }
  #deviceInner{
    position:relative; width:100%; max-width:480px; height:100%;
    background:#000; box-shadow:0 0 50px rgba(0,0,0,.6);
  }

  #app{ position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; background:linear-gradient(180deg,#173a5e,#0f1f33 120%);}

  /* ============ 顶部栏 ============ */
  #topbar{
    position:relative; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 14px 8px; color:#fff;
  }
  #topbar .title{ font-size:14px; font-weight:600; opacity:.9; }
  #topbar .icons{ display:flex; gap:8px; }
  .iconbtn{
    width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
  }
  #pagecount{ font-size:11.5px; opacity:.7; }

  /* ============ 漫画翻页区 ============ */
  #viewer{ position:relative; flex:1; overflow:hidden; display:flex; flex-direction:column;}
  #track{ position:relative; flex:1; display:flex; height:100%; transition:transform .38s cubic-bezier(.22,.68,.36,1); will-change:transform; }
  .page{ position:relative; flex:0 0 100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .page img{ max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; user-select:none; -webkit-user-drag:none; box-shadow:0 10px 40px rgba(0,0,0,.45); }

  .navbtn{
    position:absolute; top:45%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%;
    background:rgba(0,0,0,.28); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:17px; z-index:15; cursor:pointer; backdrop-filter:blur(2px);
  }
  #prevBtn{ left:8px; } #nextBtn{ right:8px; }
  .navbtn.hide{ opacity:0; pointer-events:none; }

  /* ============ 四按钮工具条 ============ */
  #toolbar{
    display:flex; justify-content:center; gap:14px;
    padding:10px 10px calc(12px + env(safe-area-inset-bottom));
    background:rgba(0,0,0,.25);
  }
  .fourbtn{
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:800; color:#fff; cursor:pointer;
    position:relative; transition:transform .15s;
  }
  .fourbtn:active{ transform:scale(.92); }

  /* 无内容：幽灵态 */
  .fourbtn.state-empty{
    background:transparent; border:2px dashed rgba(255,255,255,.28);
    color:rgba(255,255,255,.28); cursor:default;
  }
  .fourbtn.state-empty:active{ transform:none; }

  /* 待完成：实心彩色 */
  .fourbtn.state-todo{ border:2px solid rgba(255,255,255,.85); box-shadow:0 3px 10px rgba(0,0,0,.35);}
  .fourbtn.type-guide.state-todo{ background:radial-gradient(circle at 35% 30%, #f0ad55, var(--guide-orange)); }
  .fourbtn.type-explain.state-todo{ background:radial-gradient(circle at 35% 30%, #6fa8dd, var(--sky)); }
  .fourbtn.type-history.state-todo{ background:radial-gradient(circle at 35% 30%, #d98a68, var(--terracotta)); }
  .fourbtn.type-practice.state-todo{ background:radial-gradient(circle at 35% 30%, #7dc98c, var(--practice-green)); }

  /* 已完成：统一浅蓝 + 打勾 */
  .fourbtn.state-done{
    background:radial-gradient(circle at 35% 30%, #a9d4f2, var(--done-blue));
    border:2px solid #fff;
  }
  .fourbtn.state-done .label{ display:none; }
  .fourbtn.state-done .check{ display:block; }
  .fourbtn .check{ display:none; font-size:20px; }

  .fourbtn .taglabel{
    position:absolute; bottom:-16px; left:50%; transform:translateX(-50%);
    font-size:9.5px; color:rgba(255,255,255,.55); white-space:nowrap;
  }

  /* ============ 目录 / 总览 overlay ============ */
  #tocOverlay{
    position:absolute; inset:0; background:rgba(10,15,25,.94); backdrop-filter:blur(8px); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .25s;
    display:flex; flex-direction:column;
  }
  #tocOverlay.show{ opacity:1; pointer-events:auto; }
  #tocHead{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px; color:#fff;
  }
  #tocHead h2{ margin:0; font-size:17px; }
  #tocList{ flex:1; overflow-y:auto; padding:0 14px 24px; }
  .tocRow{
    display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.10);
    border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .tocRow.current{ background:rgba(95,168,221,.45); border:1px solid var(--done-blue); }
  .tocRow .num{ color:#fff; font-size:14px; font-weight:700; width:54px; flex:0 0 auto; }
  .tocRow .dots{ display:flex; gap:6px; flex:1; }
  .tocdot{ width:20px; height:20px; border-radius:50%; font-size:9px; font-weight:800; color:#fff; display:flex; align-items:center; justify-content:center; }
  .tocdot.state-empty{ background:transparent; border:1.5px dashed rgba(255,255,255,.25); color:rgba(255,255,255,.25); }
  .tocdot.type-guide.state-todo{ background:var(--guide-orange); }
  .tocdot.type-explain.state-todo{ background:var(--sky); }
  .tocdot.type-history.state-todo{ background:var(--terracotta); }
  .tocdot.type-practice.state-todo{ background:var(--practice-green); }
  .tocdot.state-done{ background:var(--done-blue); }

  /* ============ 知识卡 sheet ============ */
  #overlay{ position:absolute; inset:0; background:rgba(20,15,8,.55); opacity:0; pointer-events:none; transition:opacity .25s; z-index:30; }
  #overlay.show{ opacity:1; pointer-events:auto; }
  #sheet{
    position:absolute; left:0; right:0; bottom:0; max-height:82%;
    background:var(--paper); border-radius:20px 20px 0 0; box-shadow:0 -10px 30px rgba(0,0,0,.4);
    transform:translateY(105%); transition:transform .32s cubic-bezier(.22,.68,.36,1); z-index:31;
    padding-bottom:env(safe-area-inset-bottom); display:flex; flex-direction:column;
    background-image: repeating-linear-gradient(var(--paper) 0 27px, var(--paper-line) 27px 28px);
    background-attachment:local;
  }
  #sheet.show{ transform:translateY(0); }
  #sheet .grabber{ width:38px; height:4px; border-radius:2px; background:var(--paper-line); margin:10px auto 4px; }
  #sheetHead{ display:flex; align-items:flex-start; gap:10px; padding:10px 20px 4px; }
  #sheetHead .badge{
    flex:0 0 auto; width:34px; height:34px; border-radius:10px; color:#fff; font-size:16px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  #sheetHead .badge.type-guide{ background:var(--guide-orange); }
  #sheetHead .badge.type-explain{ background:var(--sky); }
  #sheetHead .badge.type-history{ background:var(--terracotta); }
  #sheetHead .badge.type-practice{ background:var(--practice-green); }
  #sheetTitleWrap{ flex:1; }
  #sheetTitle{ font-size:19px; font-weight:800; color:var(--ink); line-height:1.3; padding-top:4px;}
  #sheetTag{ display:inline-block; font-size:12px; color:#7a5f30; background:rgba(0,0,0,.06); padding:2px 9px; border-radius:20px; margin-top:6px; font-weight:600;}
  #speakBtn{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:var(--terracotta); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; margin-top:2px;
  }
  #speakBtn.speaking{ animation:speakPulse 1s infinite; }
  @keyframes speakPulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
  #closeSheet{ margin-left:4px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.08); display:flex; align-items:center; justify-content:center; font-size:14px; color:#665; flex:0 0 auto; cursor:pointer;}
  #sheetBody{ padding:6px 20px 30px; overflow-y:auto; font-size:15px; line-height:1.8; color:#3a2f1e; }
  #sheetBody p{ margin:0 0 12px; }

  .stepbox{ background:#fffef8; border:1.5px solid var(--paper-line); border-radius:12px; padding:14px; margin:10px 0 14px; }
  .vcalc{ font-family:"SF Mono",Consolas,monospace; font-size:26px; text-align:right; letter-spacing:2px; line-height:1.5; width:120px; margin:0 auto 10px; }
  .vcalc .line{ border-top:2.5px solid var(--ink); margin-top:2px; }
  .stepline{ font-size:14px; color:#5b4c33; min-height:20px; text-align:center; margin-bottom:10px; }
  .stepbtns{ display:flex; gap:10px; justify-content:center; }
  .btn{ appearance:none; border:none; border-radius:10px; background:var(--sky); color:#fff; font-size:14px; font-weight:600; padding:9px 16px; cursor:pointer; box-shadow:0 3px 0 var(--sky-deep); }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--sky-deep); }
  .btn.secondary{ background:#efe4c4; color:#7a5f30; box-shadow:0 3px 0 #cbb886; }
  .btn.practice-reveal{ background:var(--practice-green); box-shadow:0 3px 0 #326b3d; }

  .practice-answer{ margin-top:10px; padding:12px; background:#eef7ee; border:1.5px dashed var(--practice-green); border-radius:10px; font-size:14px; color:#2f5f38; display:none; }
  .practice-answer.show{ display:block; }

  /* ============ 封面 ============ */
  #coverScreen{
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    background:#000; overflow:hidden;
  }
  #coverScreen img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #coverFade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(10,15,25,.92) 100%);}
  #coverContent{ position:relative; z-index:2; padding:0 24px calc(40px + env(safe-area-inset-bottom)); text-align:center; width:100%;}
  #coverContent h1{ color:#fff; font-size:22px; margin:0 0 18px; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  #startBtn{
    background:var(--wheat); color:#4a2e0a; border:none; border-radius:30px; padding:14px 40px;
    font-size:16px; font-weight:800; box-shadow:0 4px 0 #c8933a; cursor:pointer;
  }
  #startBtn:active{ transform:translateY(2px); box-shadow:0 2px 0 #c8933a; }

  audio{ display:none; }

  /* ============ 新手引导 overlay ============ */
  #onboardOverlay{
    position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#1c4a7a,#0f1f33 70%);
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  #onboardOverlay.show{ opacity:1; pointer-events:auto; }
  #onboardTop{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 16px 6px;
  }
  #onboardDots{ display:flex; gap:6px; flex:1; justify-content:center; }
  #onboardDots span{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.28); transition:all .25s; }
  #onboardDots span.active{ background:var(--wheat); width:16px; border-radius:4px; }
  #onboardSkip{ font-size:13px; color:rgba(255,255,255,.65); padding:4px 8px; cursor:pointer; }

  #onboardBody{ flex:1; overflow-y:auto; padding:6px 26px 10px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  #onboardBody .charimg{
    width:180px; height:180px; border-radius:50%; object-fit:cover; object-position:center center;
    border:3px solid rgba(255,255,255,.5); box-shadow:0 8px 24px rgba(0,0,0,.35);
    margin:10px 0 18px; background:#dcefff;
  }
  #onboardBody .obBadge{
    display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:9px;
    color:#fff; font-weight:800; font-size:14px; margin-bottom:10px; box-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  #onboardBody .obBadge.type-guide{ background:var(--guide-orange); }
  #onboardBody .obBadge.type-explain{ background:var(--sky); }
  #onboardBody .obBadge.type-history{ background:var(--terracotta); }
  #onboardBody .obBadge.type-practice{ background:var(--practice-green); }

  #onboardBody h3{ color:#fff; font-size:19px; margin:0 0 12px; line-height:1.4; }
  #onboardBody p{ color:rgba(255,255,255,.88); font-size:15px; line-height:1.75; margin:0 0 16px; }

  .obDemoHint{ font-size:12.5px; color:var(--wheat); margin-bottom:10px; cursor:pointer; text-decoration:underline; }
  .obDemoBox{
    width:100%; max-width:300px; background:var(--paper); border-radius:14px; padding:14px 16px;
    margin-bottom:16px; display:none; text-align:left; color:#3a2f1e; font-size:14px; line-height:1.7;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .obDemoBox.show{ display:block; }
  .obDemoBox .demoTitle{ font-weight:800; color:var(--ink); margin-bottom:6px; font-size:14.5px; }
  .obSpeakRow{ display:flex; align-items:center; gap:8px; }
  .obSpeakBtn{
    width:30px; height:30px; border-radius:50%; background:var(--terracotta); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; flex:0 0 auto;
  }
  .obPracticeOpts{ display:flex; gap:10px; margin-top:8px; }
  .obPracticeOpts button{
    flex:1; appearance:none; border:none; border-radius:10px; background:var(--sky); color:#fff;
    font-size:14px; font-weight:700; padding:10px 0; cursor:pointer; box-shadow:0 3px 0 var(--sky-deep);
  }
  .obFeedback{ margin-top:10px; font-size:13.5px; color:var(--good); font-weight:700; display:none; }
  .obFeedback.show{ display:block; }

  #onboardBottom{ padding:10px 26px calc(20px + env(safe-area-inset-bottom)); }
  #onboardCta{
    width:100%; background:var(--wheat); color:#4a2e0a; border:none; border-radius:26px; padding:14px 0;
    font-size:15.5px; font-weight:800; box-shadow:0 4px 0 #c8933a; cursor:pointer;
  }
  #onboardCta:active{ transform:translateY(2px); box-shadow:0 2px 0 #c8933a; }
</style>

<!-- ============ 引擎代码 ============ -->
<script>
const TYPES = [
  { key:'guide',    cls:'type-guide',    label:'导' },
  { key:'explain',  cls:'type-explain',  label:'解' },
  { key:'history',  cls:'type-history',  label:'史' },
  { key:'practice', cls:'type-practice', label:'练' },
];
const STORAGE_KEY = 'xiaohe_progress_v1';
const PAGES = window.PAGE_IDS.map(id => window.PAGE_CONTENT[id]);

/* ---------- 进度存取 ---------- */
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { lastPage: 0, completed: {} };
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
let progress = loadProgress();

function isDone(id){ return !!progress.completed[id]; }
function markDone(id){
  if(!id || progress.completed[id]) return;
  progress.completed[id] = true;
  saveProgress();
}

/* ---------- 翻页 ---------- */
const track = document.getElementById('track');
const pagecountEl = document.getElementById('pagecount');
let current = Math.min(progress.lastPage || 0, PAGES.length - 1);

PAGES.forEach(p => {
  const div = document.createElement('div');
  div.className = 'page';
  const img = document.createElement('img');
  img.src = p.image;
  img.draggable = false;
  div.appendChild(img);
  track.appendChild(div);
});

function render(){
  track.style.transform = `translateX(-${current*100}%)`;
  pagecountEl.textContent = `${current+1} / ${PAGES.length}`;
  document.getElementById('prevBtn').classList.toggle('hide', current===0);
  document.getElementById('nextBtn').classList.toggle('hide', current===PAGES.length-1);
  renderToolbar();
  progress.lastPage = current;
  saveProgress();
}
function goTo(i){
  current = Math.max(0, Math.min(PAGES.length-1, i));
  render();
}
document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});

let touchStartX=null, touchStartY=null, dragging=false;
const viewer = document.getElementById('viewer');
viewer.addEventListener('touchstart', e=>{
  touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; dragging=true;
  track.style.transition='none';
},{passive:true});
viewer.addEventListener('touchmove', e=>{
  if(!dragging) return;
  const dx = e.touches[0].clientX - touchStartX;
  track.style.transform = `translateX(calc(-${current*100}% + ${dx}px))`;
},{passive:true});
viewer.addEventListener('touchend', e=>{
  if(!dragging) return;
  dragging=false; track.style.transition='';
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)){
    if(dx<0) goTo(current+1); else goTo(current-1);
  } else render();
});

/* ---------- 四按钮工具条 ---------- */
const toolbar = document.getElementById('toolbar');
function buttonState(pageData, typeKey){
  const data = pageData[typeKey];
  if(!data) return 'empty';
  return isDone(data.id) ? 'done' : 'todo';
}
function renderToolbar(){
  const pageData = PAGES[current];
  toolbar.innerHTML = '';
  TYPES.forEach(t => {
    const data = pageData[t.key];
    const state = buttonState(pageData, t.key);
    const btn = document.createElement('div');
    btn.className = `fourbtn ${t.cls} state-${state}`;
    btn.innerHTML = `<span class="label">${t.label}</span><span class="check">✓</span>`;
    if(state !== 'empty'){
      btn.addEventListener('click', ()=> openCard(t.key, data));
    }
    toolbar.appendChild(btn);
  });
}

/* ---------- 知识卡 sheet ---------- */
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const sheetBadge = document.getElementById('sheetBadge');
const sheetTitle = document.getElementById('sheetTitle');
const sheetTag = document.getElementById('sheetTag');
const sheetBody = document.getElementById('sheetBody');
const speakBtn = document.getElementById('speakBtn');
const sfxComplete = document.getElementById('sfxComplete');

const TYPE_MAP = { guide:{cls:'type-guide',label:'导'}, explain:{cls:'type-explain',label:'解'}, history:{cls:'type-history',label:'史'}, practice:{cls:'type-practice',label:'练'} };

function openCard(typeKey, data){
  const meta = TYPE_MAP[typeKey];
  sheetBadge.className = 'badge ' + meta.cls;
  sheetBadge.textContent = meta.label;
  sheetTitle.textContent = data.title || '';
  if(data.tag){ sheetTag.style.display='inline-block'; sheetTag.textContent = data.tag; }
  else sheetTag.style.display='none';

  sheetBody.innerHTML = '';

  if(typeKey === 'guide' || typeKey === 'history'){
    (data.body||'').split('\n\n').forEach(para=>{
      if(!para.trim()) return;
      const p = document.createElement('p');
      p.textContent = para;
      sheetBody.appendChild(p);
    });
  }

  if(typeKey === 'explain'){
    if(data.calc){ renderStepCalc(sheetBody, data.calc); }
    else if(data.body){
      const p = document.createElement('p'); p.textContent = data.body; sheetBody.appendChild(p);
    }
  }

  if(typeKey === 'practice'){
    const q = document.createElement('p');
    q.textContent = data.question || '';
    sheetBody.appendChild(q);
    if(data.answer){
      const revealBtn = document.createElement('button');
      revealBtn.className = 'btn practice-reveal';
      revealBtn.textContent = '看看答案对不对';
      const ansBox = document.createElement('div');
      ansBox.className = 'practice-answer';
      ansBox.textContent = '答案：' + data.answer;
      revealBtn.addEventListener('click', ()=>{ ansBox.classList.add('show'); });
      sheetBody.appendChild(revealBtn);
      sheetBody.appendChild(ansBox);
    }
  }

  // 朗读按钮：只有"史"给（也可扩展到"导"）
  if(typeKey === 'history' && 'speechSynthesis' in window){
    speakBtn.style.display = 'flex';
    speakBtn.onclick = ()=> speak(data.body || '');
  } else {
    speakBtn.style.display = 'none';
    window.speechSynthesis && window.speechSynthesis.cancel();
  }

  overlay.classList.add('show');
  sheet.classList.add('show');
  sheetBody.scrollTop = 0;

  // 完成规则：导/史/解/练 —— 点开即算完成
  const wasNew = !isDone(data.id);
  markDone(data.id);
  renderToolbar();
  // 只有"解/练"给庆祝音效，且只在第一次完成时响一次，避免每次重新打开都响
  if(wasNew && (typeKey==='explain' || typeKey==='practice')){
    try{ sfxComplete.currentTime = 0; sfxComplete.play(); }catch(e){}
  }
}
function closeCard(){
  overlay.classList.remove('show');
  sheet.classList.remove('show');
  window.speechSynthesis && window.speechSynthesis.cancel();
  speakBtn.classList.remove('speaking');
}
overlay.addEventListener('click', closeCard);
document.getElementById('closeSheet').addEventListener('click', closeCard);

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text.replace(/\n+/g,' '));
  utter.lang = 'zh-CN';
  utter.rate = 0.95;
  utter.onstart = ()=> speakBtn.classList.add('speaking');
  utter.onend = ()=> speakBtn.classList.remove('speaking');
  utter.onerror = ()=> speakBtn.classList.remove('speaking');
  window.speechSynthesis.speak(utter);
}

/* ---------- "解"竖式演示通用组件（供以后的页面使用） ---------- */
function renderStepCalc(container, calc){
  // calc: { op:'add'|'sub', a:15, b:28 }
  const isAdd = calc.op === 'add';
  const a = calc.a, b = calc.b;
  const result = isAdd ? a + b : a - b;
  const box = document.createElement('div');
  box.className = 'stepbox';
  box.innerHTML = `
    <div class="vcalc">
      <div class="carry">&nbsp;</div>
      <div>${a}</div>
      <div>${isAdd?'+':'-'}${b}</div>
      <div class="line"></div>
      <div class="result">??</div>
    </div>
    <div class="stepline">点击"下一步"，一步一步算一算</div>
    <div class="stepbtns">
      <button class="btn secondary reset">重来</button>
      <button class="btn next">下一步</button>
    </div>
  `;
  container.appendChild(box);
  const resultEl = box.querySelector('.result');
  const lineEl = box.querySelector('.stepline');
  let step = 0;
  function apply(){
    if(step===0){ resultEl.textContent='??'; lineEl.textContent='点击"下一步"，一步一步算一算'; return; }
    resultEl.textContent = result;
    lineEl.textContent = step===1 ? '再算下一位……' : `完成！结果是 ${result}`;
  }
  box.querySelector('.next').addEventListener('click', ()=>{ if(step<2) step++; apply(); });
  box.querySelector('.reset').addEventListener('click', ()=>{ step=0; apply(); });
}

/* ---------- 目录 / 总览 ---------- */
const tocOverlay = document.getElementById('tocOverlay');
const tocList = document.getElementById('tocList');
function renderToc(){
  tocList.innerHTML = '';
  PAGES.forEach((p, i)=>{
    const row = document.createElement('div');
    row.className = 'tocRow' + (i===current ? ' current' : '');
    const dotsHtml = TYPES.map(t=>{
      const data = p[t.key];
      const state = buttonState(p, t.key);
      return `<div class="tocdot ${t.cls} state-${state}">${state==='done' ? '✓' : t.label}</div>`;
    }).join('');
    row.innerHTML = `<div class="num">第 ${i+1} 页</div><div class="dots">${dotsHtml}</div>`;
    row.addEventListener('click', ()=>{ goTo(i); closeToc(); });
    tocList.appendChild(row);
  });
}
function openToc(){ renderToc(); tocOverlay.classList.add('show'); }
function closeToc(){ tocOverlay.classList.remove('show'); }
document.getElementById('tocBtn').addEventListener('click', openToc);
document.getElementById('tocClose').addEventListener('click', closeToc);

const OB_STEPS = [

  }

let obIndex = 0;

function renderObDots(){
  onboardDots.innerHTML = '';
  OB_STEPS.forEach((_, i)=>{
    const d = document.createElement('span');
    if(i === obIndex) d.className = 'active';
    onboardDots.appendChild(d);
  });
}

function renderObStep(){
  const step = OB_STEPS[obIndex];
  renderObDots();
  onboardCta.textContent = step.cta || '下一个 →';
  onboardSkip.style.display = (step.id === 'end') ? 'none' : 'block';

  let html = '';
  if(step.img) html += `<img class="charimg" src="${step.img}" alt="">`;
  if(step.badge) html += `<div class="obBadge ${step.badgeClass}">${step.badge}</div>`;
  if(step.title && step.id === 'end') html += `<h3>${step.title}</h3>`;
  step.body.split('\n\n').forEach(para=>{
    html += `<p>${para}</p>`;
  });

  if(step.demo === 'guide'){
    html += `<div class="obDemoHint" id="obDemoToggle">点这个徽章试试看</div>
      <div class="obDemoBox" id="obDemoBox">
        <div class="demoTitle">带读小提示</div>
        接下来这几页还没有数学问题，就正常陪孩子读故事就好，不用刻意往数学上引导～
      </div>`;
  }
  if(step.demo === 'explain'){
    html += `<div class="obDemoHint" id="obDemoToggle">点这个徽章试试看</div>
      <div class="obDemoBox" id="obDemoBox"><div class="demoTitle">进位加法：3 + 2</div><div id="obCalcMount"></div></div>`;
  }
  if(step.demo === 'history'){
    html += `<div class="obDemoHint" id="obDemoToggle">点这个徽章试试看</div>
      <div class="obDemoBox" id="obDemoBox">
        <div class="demoTitle">数字是怎么来的？</div>
        <div class="obSpeakRow">
          <div class="obSpeakBtn" id="obSpeakBtn">🔊</div>
          <div style="flex:1">点小喇叭听听看，这段话能被念出来哦！</div>
        </div>
      </div>`;
  }
  if(step.demo === 'practice'){
    html += `<div class="obDemoHint" id="obDemoToggle">点这个徽章试试看</div>
      <div class="obDemoBox" id="obDemoBox">
        <div class="demoTitle">1 + 1 = ?</div>
        <div class="obPracticeOpts">
          <button data-ans="1">1</button>
          <button data-ans="2">2</button>
          <button data-ans="3">3</button>
        </div>
        <div class="obFeedback" id="obFeedback">🎉 你听，这就是完成时的声音！</div>
      </div>`;
  }

  onboardBody.innerHTML = html;

  const toggle = document.getElementById('obDemoToggle');
  const box = document.getElementById('obDemoBox');
  if(toggle && box){
    toggle.addEventListener('click', ()=>{
      box.classList.toggle('show');
      if(step.demo === 'explain' && box.classList.contains('show')){
        const mount = document.getElementById('obCalcMount');
        if(mount && !mount.dataset.mounted){
          renderStepCalc(mount, { op:'add', a:3, b:2 });
          mount.dataset.mounted = '1';
        }
      }
    });
  }
  const obSpeak = document.getElementById('obSpeakBtn');
  if(obSpeak){
    obSpeak.addEventListener('click', ()=>{
      speak('数字不是一开始就有的，是很久很久以前的人一点一点发明出来的哦！');
    });
  }
  const practiceBtns = onboardBody.querySelectorAll('.obPracticeOpts button');
  practiceBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('obFeedback').classList.add('show');
      try{ sfxComplete.currentTime = 0; sfxComplete.play(); }catch(e){}
    });
  });
}

function obNext(){
  if(obIndex < OB_STEPS.length - 1){
    obIndex++;
    renderObStep();
  } else {
    finishOnboarding();
  }
}
function finishOnboarding(){
  try{ localStorage.setItem(ONBOARD_KEY, '1'); }catch(e){}
  onboardOverlay.classList.remove('show');
  window.speechSynthesis && window.speechSynthesis.cancel();
}
function openOnboarding(){
  obIndex = 0;
  renderObStep();
  onboardOverlay.classList.add('show');
}

onboardCta.addEventListener('click', obNext);
onboardSkip.addEventListener('click', finishOnboarding);
document.getElementById('helpBtn').addEventListener('click', openOnboarding);

/* 封面"开始阅读"：第一次进入时先看引导，之后直接进书 */
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('coverScreen').style.display = 'none';
  render();
  let seen = false;
  try{ seen = localStorage.getItem(ONBOARD_KEY) === '1'; }catch(e){}
  if(!seen) openOnboarding();
}, { once:false });
